services:
  frontend:
    image: ghcr.io/eronsalih/inspire-ink-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80" # i vetmi port i hapur, dhe vetëm brenda VM-së
    depends_on:
      - backend

  backend:
    image: ghcr.io/eronsalih/inspire-ink-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
