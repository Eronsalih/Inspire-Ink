services:


  db:
    image: postgres:16-alpine
    container_name: inspire-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: inspire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - inspire-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inspire_db"]
      interval: 10s
      timeout: 5s
      retries: 5



  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ghcr.io/eronsalih/inspire-ink-backend:latest

    container_name: inspire-backend
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_NAME: inspire_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - inspire-network


 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ghcr.io/eronsalih/inspire-ink-frontend:latest

    container_name: inspire-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - inspire-network



volumes:
  postgres_data:



networks:
  inspire-network:
    driver: bridge