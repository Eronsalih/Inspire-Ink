services:
  db:
    image: postgres:16-alpine
    container_name: inspire-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: inspire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - inspire-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ghcr.io/eronsalih/inspire-ink-backend:latest

    container_name: inspire-backend
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_NAME: inspire_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      - db

    networks:
      - inspire-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ghcr.io/eronsalih/inspire-ink-frontend:latest

    container_name: inspire-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - inspire-network

volumes:
  postgres_data:

networks:
  inspire-network:
    driver: bridge